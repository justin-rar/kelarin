<!DOCTYPE html><html class="light" lang="id"><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"><meta content="mobile_stack" name="shell-type"><link href="https://fonts.googleapis.com" rel="preconnect"><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { colors: { "surface-container-lowest": "#ffffff", "stat-light": "#EDEDEF", "primary-fixed": "#e5e2e1", "on-primary-container": "#858383", "secondary": "#5e5e65", "on-secondary-container": "#626269", "inverse-on-surface": "#f0f1f2", "surface": "#FFFFFF", "on-error": "#ffffff", "secondary-fixed": "#e3e1e9", "surface-container-highest": "#e2e2e3", "tertiary": "#000000", "on-tertiary-fixed-variant": "#45464c", "on-primary": "#ffffff", "stat-dark": "#E2E2E5", "outline": "#747878", "on-secondary-fixed": "#1a1b21", "surface-tint": "#5f5e5e", "fill-1": "#EFEFF1", "primary-fixed-dim": "#c9c6c5", "tertiary-fixed": "#e2e2e8", "on-surface": "#1a1c1d", "inverse-primary": "#c9c6c5", "surface-container-high": "#e8e8e9", "surface-variant": "#e2e2e3", "inverse-surface": "#2f3132", "outline-variant": "#c4c7c7", "primary": "#000000", "tertiary-container": "#1a1b20", "surface-dim": "#dadadb", "on-error-container": "#93000a", "on-secondary-fixed-variant": "#46464d", "on-tertiary": "#ffffff", "on-primary-fixed": "#1c1b1b", "on-surface-variant": "#444748", "divider": "#ECECEE", "primary-container": "#1c1b1b", "error-container": "#ffdad6", "surface-container-low": "#f3f3f4", "surface-container": "#eeeeef", "on-tertiary-container": "#838389", "secondary-container": "#e0dfe7", "background": "#f9f9fa", "surface-bright": "#f9f9fa", "tertiary-fixed-dim": "#c6c6cc", "error": "#ba1a1a", "secondary-fixed-dim": "#c7c6cd", "on-primary-fixed-variant": "#474646", "on-secondary": "#ffffff", "on-background": "#1a1c1d", "on-tertiary-fixed": "#1a1b20" }, borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, spacing: { "space-md": "0.75rem", "space-xs": "0.25rem", "space-lg": "1rem", "space-sm": "0.5rem", "space-xl": "1.5rem", "gutter": "0.75rem", "margin": "1.25rem" }, fontFamily: { "nav-label": ["Plus Jakarta Sans"], "stat-number": ["Plus Jakarta Sans"], "field-label": ["Plus Jakarta Sans"], "button-text": ["Plus Jakarta Sans"], "modal-title": ["Plus Jakarta Sans"], "body-default": ["Plus Jakarta Sans"], "card-title": ["Plus Jakarta Sans"], "splash-title": ["Plus Jakarta Sans"], "headline-h1": ["Plus Jakarta Sans"], "caption-meta": ["Plus Jakarta Sans"] }, fontSize: { "nav-label": ["11px", { lineHeight: "14px", fontWeight: "600" }], "stat-number": ["32px", { lineHeight: "38px", letterSpacing: "-0.03em", fontWeight: "800" }], "field-label": ["12px", { lineHeight: "16px", fontWeight: "700" }], "button-text": ["14px", { lineHeight: "20px", fontWeight: "700" }], "modal-title": ["18px", { lineHeight: "24px", fontWeight: "700" }], "body-default": ["14px", { lineHeight: "20px", fontWeight: "500" }], "card-title": ["16px", { lineHeight: "22px", fontWeight: "700" }], "splash-title": ["28px", { lineHeight: "36px", letterSpacing: "-0.02em", fontWeight: "800" }], "headline-h1": ["24px", { lineHeight: "32px", letterSpacing: "-0.02em", fontWeight: "800" }], "caption-meta": ["12px", { lineHeight: "16px", fontWeight: "500" }] } } } };</script><style>@layer base { html, body { width: 100%; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; background-color: #F6F6F7; color: #0A0A0A; -webkit-tap-highlight-color: transparent; } body { overscroll-behavior-y: none; } .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px); } .pt-safe { padding-top: env(safe-area-inset-top, 0px); } main > :first-child { margin-top: 0 !important; } main > :last-child { margin-bottom: 0 !important; } } ::-webkit-scrollbar { display: none; }</style></head><body class="bg-[#F6F6F7] min-h-screen flex flex-col antialiased selection:bg-primary selection:text-on-primary"><header class="fixed top-0 inset-x-0 z-50 bg-[#F6F6F7]/85 backdrop-blur-xl pt-safe shadow-[0_1px_8px_rgba(0,0,0,0.03)]"><div class="h-14 px-margin max-w-[390px] mx-auto flex items-center justify-between relative"><button aria-label="Kembali" class="w-11 h-11 rounded-full bg-surface shadow-[0_8px_24px_rgba(0,0,0,0.06)] flex items-center justify-center text-primary active:scale-95 transition-transform" onclick="history.back()"><span class="material-symbols-outlined text-[20px]">arrow_back</span></button><h1 class="absolute left-1/2 -translate-x-1/2 font-modal-title text-modal-title text-primary tracking-tight pointer-events-none select-none">Edit Profil</h1><div class="w-11 h-11 pointer-events-none" aria-hidden="true"></div></div></header><main class="flex-1 flex flex-col relative w-full max-w-[390px] mx-auto px-margin pt-14 pb-safe bg-[#F6F6F7]"><div class="flex flex-col w-full pb-36">
<!-- Avatar Upload Area -->
<div class="flex flex-col items-center justify-center pt-2 pb-6">
<div class="relative w-24 h-24 mb-3">
<div class="w-24 h-24 rounded-full bg-primary flex items-center justify-center select-none shadow-[0_8px_24px_rgba(0,0,0,0.08)]">
<span class="text-on-primary font-splash-title text-splash-title leading-none">T</span>
</div>
<button aria-label="Ubah foto profil" class="absolute bottom-0 right-0 w-8 h-8 rounded-full bg-surface shadow-[0_4px_12px_rgba(0,0,0,0.12)] flex items-center justify-center text-primary active:scale-95 transition-transform" type="button">
<span class="material-symbols-outlined text-[16px]">photo_camera</span>
</button>
</div>


</div>
<!-- Form Fields Stack -->
<form class="flex flex-col gap-4" id="edit-profile-form" onsubmit="event.preventDefault();">
<!-- Field 1: Nama Lengkap -->
<div class="flex flex-col gap-1.5">
<label class="font-field-label text-field-label text-secondary" for="full-name">
        Nama Lengkap *
      </label>
<div class="h-[52px] bg-surface rounded-2xl shadow-[0_4px_16px_rgba(0,0,0,0.04)] px-4 flex items-center gap-3">
<span class="material-symbols-outlined text-[20px] text-secondary select-none">person</span>
<input class="flex-1 bg-transparent font-body-default text-body-default text-on-surface placeholder:text-outline-variant focus:outline-none" id="full-name" placeholder="Masukkan nama lengkap" required="" type="text" value="Titut">
</div>
</div>
<!-- Field 2: Email -->
<div class="flex flex-col gap-1.5">
<label class="font-field-label text-field-label text-secondary" for="user-email">
        Email *
      </label>
<div class="h-[52px] bg-surface rounded-2xl shadow-[0_4px_16px_rgba(0,0,0,0.04)] px-4 flex items-center gap-3">
<span class="material-symbols-outlined text-[20px] text-secondary select-none">mail</span>
<input class="flex-1 bg-transparent font-body-default text-body-default text-on-surface placeholder:text-outline-variant focus:outline-none" id="user-email" placeholder="nama@email.com" required="" type="email" value="titut.student@taskflow.id">
</div>
<p class="text-[11px] leading-[15px] font-medium text-secondary px-1">
        Email digunakan untuk sinkronisasi akun &amp; notifikasi tugas.
      </p>
</div>
<!-- Field 3: NIM -->
<div class="flex flex-col gap-1.5">
<label class="font-field-label text-field-label text-secondary" for="student-id">
        NIM (Opsional)
      </label>
<div class="h-[52px] bg-surface rounded-2xl shadow-[0_4px_16px_rgba(0,0,0,0.04)] px-4 flex items-center gap-3">
<span class="material-symbols-outlined text-[20px] text-secondary select-none">badge</span>
<input class="flex-1 bg-transparent font-body-default text-body-default text-on-surface placeholder:text-outline-variant focus:outline-none" id="student-id" placeholder="Contoh: 2108561001" type="text" value="2108561088">
</div>
</div>
<!-- Additional Academic Meta Card -->
<div class="mt-2 p-4 bg-surface rounded-[20px] shadow-[0_4px_16px_rgba(0,0,0,0.04)] flex items-center justify-between">
<div class="flex items-center gap-3 min-w-0">
<div class="w-10 h-10 rounded-full bg-fill-1 flex items-center justify-center flex-shrink-0 text-primary">
<span class="material-symbols-outlined text-[20px]">school</span>
</div>
<div class="flex flex-col min-w-0">
<span class="font-card-title text-card-title text-primary leading-tight truncate">
            Status Akademik
          </span>
<span class="font-caption-meta text-caption-meta text-secondary truncate mt-0.5">
            Semester 5 • Informatika
          </span>
</div>
</div>
<span class="material-symbols-outlined text-secondary text-[18px]">verified</span>
</div>
</form>
<!-- Sticky Bottom Actions -->
<div class="fixed bottom-0 inset-x-0 z-40 bg-surface shadow-[0_-4px_20px_rgba(0,0,0,0.05)] pb-safe">
<div class="max-w-[390px] mx-auto px-margin py-4 flex flex-col gap-2">
<button class="w-full h-[52px] rounded-full bg-primary text-on-primary font-button-text text-button-text flex items-center justify-center gap-2 active:scale-[0.99] transition-transform shadow-[0_8px_20px_rgba(0,0,0,0.12)]" onclick="saveProfile()" type="button">
<span class="material-symbols-outlined text-[20px]">check</span>
<span>Simpan Perubahan</span>
</button>
<button class="w-full h-[52px] rounded-full bg-fill-1 text-primary font-button-text text-button-text flex items-center justify-center active:bg-surface-container-highest transition-colors" onclick="history.back()" type="button">
<span>Batal</span>
</button>
</div>
</div>
<!-- Toast Notification Feedback -->
<div class="fixed bottom-32 left-1/2 -translate-x-1/2 z-50 pointer-events-none opacity-0 translate-y-2 transition-all duration-300 w-[calc(100%-40px)] max-w-[350px]" id="save-toast">
<div class="h-14 rounded-[20px] bg-primary text-on-primary px-4 flex items-center justify-between shadow-[0_12px_28px_rgba(0,0,0,0.2)]">
<div class="flex items-center gap-2.5">
<span class="material-symbols-outlined text-[20px] text-on-primary">check_circle</span>
<span class="font-body-default text-body-default text-on-primary">Profil berhasil diperbarui</span>
</div>
<button class="pointer-events-auto font-button-text text-button-text text-on-primary underline ml-2" onclick="dismissToast()" type="button">Urungkan</button>
</div>
</div>
</div>
<script>
  function saveProfile() {
    const toast = document.getElementById('save-toast');
    if (!toast) return;
    toast.classList.remove('opacity-0', 'translate-y-2', 'pointer-events-none');
    toast.classList.add('opacity-100', 'translate-y-0');
    setTimeout(() => {
      dismissToast();
    }, 2800);
  }

  function dismissToast() {
    const toast = document.getElementById('save-toast');
    if (!toast) return;
    toast.classList.add('opacity-0', 'translate-y-2', 'pointer-events-none');
    toast.classList.remove('opacity-100', 'translate-y-0');
  }
</script></main>

</body></html>
