5f5e5e","primary-fixed-dim":"#c9c6c5","stat-light":"#EDEDEF"},"borderRadius":{"DEFAULT":"0.25rem","lg":"0.5rem","xl":"0.75rem","full":"9999px"},"spacing":{"margin":"1.25rem","space-xl":"1.5rem","space-sm":"0.5rem","space-xs":"0.25rem","space-lg":"1rem","gutter":"0.75rem","space-md":"0.75rem"},"fontFamily":{"field-label":["Plus Jakarta Sans"],"headline-h1":["Plus Jakarta Sans"],"nav-label":["Plus Jakarta Sans"],"body-default":["Plus Jakarta Sans"],"modal-title":["Plus Jakarta Sans"],"caption-meta":["Plus Jakarta Sans"],"stat-number":["Plus Jakarta Sans"],"button-text":["Plus Jakarta Sans"],"card-title":["Plus Jakarta Sans"],"splash-title":["Plus Jakarta Sans"]},"fontSize":{"field-label":["12px",{"lineHeight":"16px","fontWeight":"700"}],"headline-h1":["24px",{"lineHeight":"32px","letterSpacing":"-0.02em","fontWeight":"800"}],"nav-label":["11px",{"lineHeight":"14px","fontWeight":"600"}],"body-default":["14px",{"lineHeight":"20px","fontWeight":"500"}],"modal-title":["18px",{"lineHeight":"24px","fontWeight":"700"}],"caption-meta":["12px",{"lineHeight":"16px","fontWeight":"500"}],"stat-number":["32px",{"lineHeight":"38px","letterSpacing":"-0.03em","fontWeight":"800"}],"button-text":["14px",{"lineHeight":"20px","fontWeight":"700"}],"card-title":["16px",{"lineHeight":"22px","fontWeight":"700"}],"splash-title":["28px",{"lineHeight":"36px","letterSpacing":"-0.02em","fontWeight":"800"}]}}}};</script></head><body class="bg-background font-body-default text-on-surface antialiased"><header class="fixed top-0 w-full z-50 pt-safe bg-background/80 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)]"><div class="h-14 px-margin flex items-center justify-between relative"><button aria-label="Kembali" class="w-11 h-11 rounded-full bg-surface shadow-[0_8px_24px_rgba(0,0,0,0.06)] flex items-center justify-center text-on-surface hover:bg-surface-container-low active:scale-95 transition-all z-10" onclick="history.back()"><span class="material-symbols-outlined text-[20px]">chevron_left</span></button><div class="absolute inset-0 flex items-center justify-center pointer-events-none"><h1 class="font-modal-title text-modal-title text-on-surface tracking-tight font-bold">Tambah Absen</h1></div><div class="w-11 h-11 pointer-events-none" aria-hidden="true"></div></div></header><main class="flex flex-col relative w-full pt-14 pb-28 px-margin bg-background min-h-screen"><div class="flex flex-col w-full pb-8">
<form class="flex flex-col gap-5 w-full" id="form-absen" onsubmit="event.preventDefault();">
<!-- Field 1: Nama Mata Kuliah -->
<div class="flex flex-col gap-2 w-full">
<label class="font-field-label text-field-label text-secondary" for="matkul">Nama Mata Kuliah *</label>
<div class="relative w-full h-[52px] bg-surface rounded-[16px] shadow-[0_8px_24px_rgba(0,0,0,0.06)] flex items-center px-4">
<input class="w-full bg-transparent border-0 outline-none p-0 font-body-default text-body-default text-on-surface placeholder:text-outline-variant font-medium" id="matkul" placeholder="Contoh: Pemrograman Web Lanjut" required="" type="text">
</div>
</div>
<!-- Field 2: Kelas & Ruangan (2 Kolom) -->
<div class="grid grid-cols-2 gap-3 w-full">
<div class="flex flex-col gap-2 min-w-0">
<label class="font-field-label text-field-label text-secondary truncate" for="kelas">Kelas *</label>
<div class="h-[52px] bg-surface rounded-[16px] shadow-[0_8px_24px_rgba(0,0,0,0.06)] flex items-center px-4">
<input class="w-full bg-transparent border-0 outline-none p-0 font-body-default text-body-default text-on-surface placeholder:text-outline-variant font-medium truncate" id="kelas" placeholder="Contoh: 4A" required="" type="text">
</div>
</div>
<div class="flex flex-col gap-2 min-w-0">
<label class="font-field-label text-field-label text-secondary truncate" for="ruangan">Ruangan *</label>
<div class="h-[52px] bg-surface rounded-[16px] shadow-[0_8px_24px_rgba(0,0,0,0.06)] flex items-center px-4">
<input class="w-full bg-transparent border-0 outline-none p-0 font-body-default text-body-default text-on-surface placeholder:text-outline-variant font-medium truncate" id="ruangan" placeholder="Lab Komputer 3" required="" type="text">
</div>
</div>
</div>
<!-- Field 3: Hari -->
<!-- Field 3 & 4: Jadwal & Waktu Unified Card -->
<div class="flex flex-col gap-2 w-full">
<label class="font-field-label text-field-label text-secondary">
        Jadwal &amp; Waktu
      </label>
<div class="grid grid-cols-2 gap-3 w-full">
<!-- Tanggal -->
<button class="w-full h-[52px] bg-surface rounded-[16px] shadow-[0_8px_24px_rgba(0,0,0,0.06)] flex items-center px-4 gap-2.5 text-left active:scale-[0.98] transition-transform focus:outline-none" type="button">
<span class="material-symbols-outlined text-[18px] text-secondary select-none">calendar_today</span>
<span class="font-body-default text-body-default text-on-surface select-none truncate font-medium">Hari ini, 24 Mei</span>
</button>
<!-- Waktu -->
<button class="w-full h-[52px] bg-surface rounded-[16px] shadow-[0_8px_24px_rgba(0,0,0,0.06)] flex items-center px-4 gap-2.5 text-left active:scale-[0.98] transition-transform focus:outline-none" type="button">
<span class="material-symbols-outlined text-[18px] text-secondary select-none">schedule</span>
<span class="font-body-default text-body-default text-on-surface select-none truncate font-medium">09:00 WIB</span>
</button>
</div>
</div>
<!-- Field 4: Jam Mulai & Jam Selesai -->

<!-- Field 5: Tipe Kelas -->
<div class="flex flex-col gap-2 w-full">
<span class="font-field-label text-field-label text-secondary">Tipe Kelas *</span>
<div class="grid grid-cols-2 gap-2 w-full">
<button class="h-12 rounded-[16px] bg-primary text-on-primary font-button-text text-button-text font-bold transition-all flex items-center justify-center shadow-[0_4px_12px_rgba(0,0,0,0.08)] active:scale-[0.98]" id="btn-tipe-praktikum" onclick="selectType('praktikum')" type="button">
          Praktikum
        </button>
<button class="h-12 rounded-[16px] bg-fill-1 text-secondary font-button-text text-button-text font-medium transition-all flex items-center justify-center active:scale-[0.98]" id="btn-tipe-teori" onclick="selectType('teori')" type="button">
          Teori
        </button>
</div>
</div>
<!-- Section 6: Notifikasi Absen -->
<div class="flex flex-col gap-2 w-full pt-1">
<span class="font-field-label text-field-label text-secondary">Notifikasi Absen</span>
<div class="bg-surface rounded-[24px] shadow-[0_8px_24px_rgba(0,0,0,0.06)] overflow-hidden flex flex-col">
<!-- Row 1 -->
<div class="flex items-center justify-between p-4 bg-surface active:bg-surface-container-low transition-colors">
<div class="flex items-center gap-3 min-w-0 pr-3">
<div class="w-9 h-9 rounded-full bg-fill-1 flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-[18px] text-on-surface">notifications</span>
</div>
<span class="font-body-default text-body-default font-medium text-on-surface truncate">Saat kuliah dimulai</span>
</div>
<button aria-checked="true" class="toggle-switch relative w-12 h-7 bg-primary rounded-full transition-colors duration-200 shrink-0 p-0.5 focus:outline-none" onclick="toggleSwitch(this)" role="switch" type="button">
<span class="block w-6 h-6 bg-surface rounded-full shadow-sm transform translate-x-5 transition-transform duration-200"></span>
</button>
</div>
<div class="h-[1px] bg-divider w-full"></div>
<!-- Row 2 -->
<div class="flex items-center justify-between p-4 bg-surface active:bg-surface-container-low transition-colors">
<div class="flex items-center gap-3 min-w-0 pr-3">
<div class="w-9 h-9 rounded-full bg-fill-1 flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-[18px] text-on-surface">notifications</span>
</div>
<span class="font-body-default text-body-default font-medium text-on-surface truncate">15 menit sebelum</span>
</div>
<button aria-checked="true" class="toggle-switch relative w-12 h-7 bg-primary rounded-full transition-colors duration-200 shrink-0 p-0.5 focus:outline-none" onclick="toggleSwitch(this)" role="switch" type="button">
<span class="block w-6 h-6 bg-surface rounded-full shadow-sm transform translate-x-5 transition-transform duration-200"></span>
</button>
</div>
<div class="h-[1px] bg-divider w-full"></div>
<!-- Row 3 -->
<div class="flex items-center justify-between p-4 bg-surface active:bg-surface-container-low transition-colors">
<div class="flex items-center gap-3 min-w-0 pr-3">
<div class="w-9 h-9 rounded-full bg-fill-1 flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-[18px] text-secondary">notifications_off</span>
</div>
<span class="font-body-default text-body-default font-medium text-on-surface truncate">30 menit sebelum</span>
</div>
<button aria-checked="false" class="toggle-switch relative w-12 h-7 bg-fill-1 rounded-full transition-colors duration-200 shrink-0 p-0.5 focus:outline-none" onclick="toggleSwitch(this)" role="switch" type="button">
<span class="block w-6 h-6 bg-surface rounded-full shadow-sm transform translate-x-0 transition-transform duration-200"></span>
</button>
</div>
</div>
</div>
</form>
</div>
<script>
  function selectDay(element) {
    document.querySelectorAll('.day-pill').forEach(btn => {
      btn.className = 'day-pill h-9 px-4 rounded-full bg-fill-1 text-secondary font-caption-meta text-caption-meta font-medium shrink-0 transition-transform active:scale-95 flex items-center justify-center';
    });
    element.className = 'day-pill h-9 px-4 rounded-full bg-primary text-on-primary font-caption-meta text-caption-meta font-bold shrink-0 transition-transform active:scale-95 flex items-center justify-center shadow-[0_4px_12px_rgba(0,0,0,0.08)]';
  }

  function selectType(type) {
    const praktikumBtn = document.getElementById('btn-tipe-praktikum');
    const teoriBtn = document.getElementById('btn-tipe-teori');
    
    if (type === 'praktikum') {
      praktikumBtn.className = 'h-12 rounded-[16px] bg-primary text-on-primary font-button-text text-button-text font-bold transition-all flex items-center justify-center shadow-[0_4px_12px_rgba(0,0,0,0.08)] active:scale-[0.98]';
      teoriBtn.className = 'h-12 rounded-[16px] bg-fill-1 text-secondary font-button-text text-button-text font-medium transition-all flex items-center justify-center active:scale-[0.98]';
    } else {
      teoriBtn.className = 'h-12 rounded-[16px] bg-primary text-on-primary font-button-text text-button-text font-bold transition-all flex items-center justify-center shadow-[0_4px_12px_rgba(0,0,0,0.08)] active:scale-[0.98]';
      praktikumBtn.className = 'h-12 rounded-[16px] bg-fill-1 text-secondary font-button-text text-button-text font-medium transition-all flex items-center justify-center active:scale-[0.98]';
    }
  }

  function toggleSwitch(element) {
    const isChecked = element.getAttribute('aria-checked') === 'true';
    const thumb = element.querySelector('span');
    
    if (isChecked) {
      element.setAttribute('aria-checked', 'false');
      element.classList.remove('bg-primary');
      element.classList.add('bg-fill-1');
      thumb.classList.remove('translate-x-5');
      thumb.classList.add('translate-x-0');
    } else {
      element.setAttribute('aria-checked', 'true');
      element.classList.remove('bg-fill-1');
      element.classList.add('bg-primary');
      thumb.classList.remove('translate-x-0');
      thumb.classList.add('translate-x-5');
    }
  }
</script></main><footer class="fixed bottom-0 w-full z-40 pb-safe bg-surface/90 backdrop-blur-xl shadow-[0_-4px_24px_rgba(0,0,0,0.04)]"><div class="px-margin py-3 max-w-[390px] mx-auto flex flex-col gap-2"><button class="w-full h-[52px] bg-primary text-on-primary rounded-full font-button-text text-button-text font-bold active:scale-[0.99] transition-transform flex items-center justify-center shadow-[0_8px_24px_rgba(0,0,0,0.1)]" form="form-absen" type="submit">Simpan Absen</button><button class="w-full h-[52px] bg-fill-1 text-on-surface rounded-full font-button-text text-button-text font-bold active:bg-surface-container transition-colors flex items-center justify-center" onclick="history.back()" type="button">Batal</button></div></footer>







</body></html>
