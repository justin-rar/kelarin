<script>
  // Prioritas Selector
  const priorityContainer = document.getElementById('priority-selector');
  if (priorityContainer) {
    const priorityButtons = priorityContainer.querySelectorAll('button');
    priorityButtons.forEach((btn) => {
      btn.addEventListener('click', () => {
        priorityButtons.forEach((b) => {
          b.className = 'h-12 rounded-xl bg-fill-1 text-on-surface font-button-text text-button-text flex items-center justify-center transition-all active:scale-[0.98] focus:outline-none select-none';
        });
        btn.className = 'h-12 rounded-xl bg-primary text-on-primary font-button-text text-button-text flex items-center justify-center transition-all active:scale-[0.98] shadow-[0_4px_12px_rgba(0,0,0,0.08)] focus:outline-none select-none';
      });
    });
  }

  // Tipe Tugas Selector
  const typeContainer = document.getElementById('type-selector');
  if (typeContainer) {
    const typeButtons = typeContainer.querySelectorAll('button');
    typeButtons.forEach((btn) => {
      btn.addEventListener('click', () => {
        typeButtons.forEach((b) => {
          b.className = 'h-12 rounded-xl bg-fill-1 text-on-surface font-button-text text-button-text flex items-center justify-center transition-all active:scale-[0.98] focus:outline-none select-none';
        });
        btn.className = 'h-12 rounded-xl bg-primary text-on-primary font-button-text text-button-text flex items-center justify-center transition-all active:scale-[0.98] shadow-[0_4px_12px_rgba(0,0,0,0.08)] focus:outline-none select-none';
      });
    });
  }

  // Toggle Switches
  const toggles = document.querySelectorAll('.toggle-btn');
  toggles.forEach((toggle) => {
    toggle.addEventListener('click', () => {
      const isChecked = toggle.getAttribute('aria-checked') === 'true';
      const thumb = toggle.querySelector('span');
      if (isChecked) {
        toggle.setAttribute('aria-checked', 'false');
        toggle.classList.remove('bg-primary');
        toggle.classList.add('bg-divider');
        thumb.classList.remove('translate-x-5');
      } else {
        toggle.setAttribute('aria-checked', 'true');
        toggle.classList.remove('bg-divider');
        toggle.classList.add('bg-primary');
        thumb.classList.add('translate-x-5');
      }
    });
  });

  // Current Location Fill Simulation
  const locBtn = document.getElementById('btn-current-location');
  const locInput = document.getElementById('lokasi-tugas');
  if (locBtn && locInput) {
    locBtn.addEventListener('click', () => {
      locInput.value = 'Gedung Rektorat Lt. 2';
      locInput.focus();
    });
  }
