<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"><meta content="mobile_stack" name="shell-type"><link href="https://fonts.googleapis.com" rel="preconnect"><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">

  </head><body class="bg-background font-body-default text-on-surface flex flex-col min-h-screen"><header class="fixed top-0 inset-x-0 z-50 bg-background/85 backdrop-blur-xl pt-safe"><div class="h-16 px-margin flex items-center justify-between"><button aria-label="Kembali" class="w-11 h-11 rounded-full bg-surface shadow-[0_8px_24px_rgba(0,0,0,0.06)] flex items-center justify-center text-primary active:scale-95 transition-transform" onclick="history.back()"><span class="material-symbols-outlined text-[20px]">arrow_back</span></button><div class="flex flex-col items-center justify-center text-center"><h1 class="font-modal-title text-modal-title text-primary tracking-tight">Tanya Ai</h1><p class="font-caption-meta text-caption-meta text-secondary mt-0.5">Asisten Studi &amp; Agenda</p></div><div class="w-11 h-11 shrink-0" aria-hidden="true"></div></div></header><main class="flex flex-col flex-1 relative w-full px-margin pt-16 pb-safe bg-background"><div class="flex flex-col w-full pb-28">
<!-- Top Auxiliary Action Row (Since header handles back & main title) -->
<div class="flex items-center justify-between pt-1 pb-3">
<div class="flex items-center gap-1.5">
<span class="inline-block w-2 h-2 rounded-full bg-primary animate-pulse"></span>
<span class="font-caption-meta text-caption-meta text-secondary">Model Aktif • Respons Kilat</span>
</div>
<button aria-label="Bersihkan Riwayat" class="flex items-center gap-1 px-2.5 py-1 rounded-full bg-fill-1 text-secondary active:scale-95 transition-transform" type="button">
<span class="material-symbols-outlined text-[15px]">history</span>
<span class="font-caption-meta text-[11px] font-semibold text-secondary">Riwayat</span>
</button>
</div>
<!-- Hero Empty State Section -->
<section class="flex flex-col items-center text-center mt-2 mb-6">
<!-- Centered Sparkle Circle Badge -->
<div class="relative w-24 h-24 rounded-full bg-fill-1 flex items-center justify-center mb-5 shadow-[0_8px_24px_rgba(0,0,0,0.04)]">
<span class="material-symbols-outlined text-primary text-[42px] select-none">auto_awesome</span>
<div class="absolute -bottom-1 -right-1 w-7 h-7 rounded-full bg-surface shadow-[0_4px_12px_rgba(0,0,0,0.08)] flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-[16px]">bolt</span>
</div>
</div>
<!-- Title & Description -->
<h2 class="font-headline-h1 text-[20px] leading-[26px] font-extrabold text-primary tracking-tight">
      Mulai Tanya AI
    </h2>
<p class="font-body-default text-body-default text-secondary mt-2 max-w-[280px] text-center leading-[22px]">
      Tanyakan jadwal kuliah, rangkum materi catatan, atau minta rekomendasi pembagian waktu belajar.
    </p>
</section>
<!-- Suggestions Section -->
<section class="flex flex-col w-full">
<div class="flex items-center justify-between mb-3 px-1">
<span class="font-field-label text-[11px] font-bold text-secondary tracking-widest uppercase">
        Saran Pertanyaan Cepat
      </span>
<span class="font-caption-meta text-[11px] text-secondary">Sentuh untuk pakai</span>
</div>
<!-- Stacked Suggestion Cards -->
<div class="flex flex-col gap-2.5 w-full">
<!-- Card 1 -->
<button class="w-full text-left bg-surface rounded-[20px] p-4 shadow-[0_8px_24px_rgba(0,0,0,0.06)] flex items-center justify-between gap-3 active:scale-[0.98] transition-all duration-150" onclick="selectPrompt(this)" type="button">
<div class="flex items-center gap-3.5 min-w-0">
<div class="w-9 h-9 rounded-full bg-fill-1 flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-primary text-[19px]">calendar_today</span>
</div>
<span class="font-body-default text-body-default font-semibold text-primary truncate">
            Apa saja jadwal kuliah &amp; tugas hari ini?
          </span>
</div>
<span class="material-symbols-outlined text-outline-variant text-[18px] shrink-0">chevron_right</span>
</button>
<!-- Card 2 -->
<button class="w-full text-left bg-surface rounded-[20px] p-4 shadow-[0_8px_24px_rgba(0,0,0,0.06)] flex items-center justify-between gap-3 active:scale-[0.98] transition-all duration-150" onclick="selectPrompt(this)" type="button">
<div class="flex items-center gap-3.5 min-w-0">
<div class="w-9 h-9 rounded-full bg-fill-1 flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-primary text-[19px]">schedule</span>
</div>
<span class="font-body-default text-body-default font-semibold text-primary truncate">
            Buatkan rencana belajar ujian Basis Data
          </span>
</div>
<span class="material-symbols-outlined text-outline-variant text-[18px] shrink-0">chevron_right</span>
</button>
<!-- Card 3 -->
<button class="w-full text-left bg-surface rounded-[20px] p-4 shadow-[0_8px_24px_rgba(0,0,0,0.06)] flex items-center justify-between gap-3 active:scale-[0.98] transition-all duration-150" onclick="selectPrompt(this)" type="button">
<div class="flex items-center gap-3.5 min-w-0">
<div class="w-9 h-9 rounded-full bg-fill-1 flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-primary text-[19px]">description</span>
</div>
<span class="font-body-default text-body-default font-semibold text-primary truncate">
            Rangkum catatan kuliah terakhirku
          </span>
</div>
<span class="material-symbols-outlined text-outline-variant text-[18px] shrink-0">chevron_right</span>
</button>
<!-- Card 4 -->
<button class="w-full text-left bg-surface rounded-[20px] p-4 shadow-[0_8px_24px_rgba(0,0,0,0.06)] flex items-center justify-between gap-3 active:scale-[0.98] transition-all duration-150" onclick="selectPrompt(this)" type="button">
<div class="flex items-center gap-3.5 min-w-0">
<div class="w-9 h-9 rounded-full bg-fill-1 flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-primary text-[19px]">check_circle</span>
</div>
<span class="font-body-default text-body-default font-semibold text-primary truncate">
            Bantu prioritaskan 5 tugas menumpuk
          </span>
</div>
<span class="material-symbols-outlined text-outline-variant text-[18px] shrink-0">chevron_right</span>
</button>
</div>
</section>
<!-- Sticky Bottom Bar -->
<div class="fixed bottom-0 inset-x-0 z-40 px-margin pb-safe pt-2 bg-gradient-to-t from-background via-background/95 to-transparent pointer-events-none">
<div class="pointer-events-auto pb-4 w-full">
<form class="h-14 w-full bg-surface rounded-full shadow-[0_8px_24px_rgba(0,0,0,0.08)] px-3 flex items-center justify-between gap-2.5" onsubmit="handleSend(event)">
<!-- Attachment / Plus Icon -->
<button aria-label="Lampirkan Catatan atau Jadwal" class="w-9 h-9 rounded-full bg-fill-1 flex items-center justify-center text-secondary active:scale-95 transition-transform shrink-0" type="button">
<span class="material-symbols-outlined text-[20px]">add</span>
</button>
<!-- Input Field -->
<input autocomplete="off" class="flex-1 bg-transparent border-0 outline-none font-body-default text-body-default text-primary placeholder:text-outline placeholder:font-caption-meta placeholder:text-caption-meta py-2" id="ai-prompt-input" placeholder="Tanya apa saja seputar kuliah..." type="text">
<!-- Send Button -->
<button aria-label="Kirim Pertanyaan" class="w-10 h-10 rounded-full bg-primary flex items-center justify-center text-on-primary shadow-sm active:scale-95 transition-transform shrink-0" type="submit">
<span class="material-symbols-outlined text-[20px]">arrow_upward</span>
</button>
</form>
</div>
</div>
</div>
<script>
  function selectPrompt(buttonElement) {
    const promptText = buttonElement.querySelector('span.truncate').innerText.trim();
    const input = document.getElementById('ai-prompt-input');
    if (input) {
      input.value = promptText;
      input.focus();
    }
  }

  function handleSend(event) {
    event.preventDefault();
    const input = document.getElementById('ai-prompt-input');
    if (input && input.value.trim() !== '') {
      input.value = '';
      input.placeholder = 'Memproses jawaban...';
      setTimeout(() => {
        if (input) {
          input.placeholder = 'Tanya apa saja seputar kuliah...';
        }
      }, 1500);
    }
  }
</script></main>

</body></html>
